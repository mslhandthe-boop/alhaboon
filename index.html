<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الهابون - Alhaboon</title>
<link rel="icon" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma}
body{background:#f5fffe;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{width:100%;max-width:380px;background:#fff;padding:25px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
.icon{width:90px;height:90px;background:linear-gradient(#0ecb81,#075e54);border-radius:22px;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:50px;color:#fff}
h1{color:#075e54;font-size:32px;margin:0}
h1 span{font-size:16px;display:block;color:#888;font-weight:normal;margin-top:5px}
.input{position:relative;margin:12px 0}
.input input{width:100%;padding:14px 45px 14px 15px;border:1.5px solid #e8ecec;border-radius:12px;outline:none;font-size:16px;background:#f9fafb}
.input input:focus{border-color:#0ecb81;background:#fff}
.input i{position:absolute;right:14px;top:14px;font-size:20px}
.btn{width:100%;padding:14px;background:linear-gradient(to left,#075e54,#0a8a73);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn:active{transform:scale(.98)}
.link{margin-top:15px;font-size:14px;color:#666}
.link b{color:#075e54;cursor:pointer}
.error{display:none;background:#ffeaea;color:#d33;padding:10px;border-radius:10px;margin-top:10px;font-size:14px}
.app{display:none;width:100%;max-width:1000px;height:100vh;background:#f0f2f5}
</style>
</head>
<body>

<div class="box" id="loginBox">
<div class="icon">💬</div>
<h1>الهابون <span>منصة التواصل الاجتماعي الخاصة بك</span></h1>

<div style="text-align:right;margin-top:25px">
<label style="font-size:14px;font-weight:bold;color:#333">البريد الإلكتروني</label>
<div class="input"><i>📧</i><input id="email" type="email" placeholder="example@gmail.com" dir="ltr"></div>

<label style="font-size:14px;font-weight:bold;color:#333">كلمة المرور</label>
<div class="input"><i>🔒</i><input id="pass" type="password" placeholder="••••••••" dir="ltr"></div>

<label style="font-size:14px;font-weight:bold;color:#333">اسمك (للمرة الأولى فقط)</label>
<div class="input"><i>👤</i><input id="name" placeholder="مثال: محمد"></div>
</div>

<div class="error" id="err">تأكد من البريد وكلمة السر</div>

<button class="btn" onclick="loginEmail()">تسجيل الدخول ←</button>

<div class="link">ليس لديك حساب؟ <b onclick="registerEmail()">إنشاء حساب جديد</b><br><br><small>بالدخول، فإنك توافق على شروط الاستخدام وسياسة الخصوصية</small></div>
</div>

<div class="app" id="appBox"></div>

<script>
function loginEmail(){
 let e=document.getElementById('email').value.trim();
 let p=document.getElementById('pass').value.trim();
 if(!e.includes('@') || p.length<4){
  document.getElementById('err').style.display='block';
  document.getElementById('err').innerText='الرجاء كتابة بريد صحيح وكلمة سر 4 أحرف على الأقل';
  return;
 }
 let n=document.getElementById('name').value.trim() || e.split('@')[0];
 let users=JSON.parse(localStorage.getItem('haboon_users')||'{}');
 // إذا المستخدم جديد، نسجله
 if(!users[e]){users[e]={name:n,pass:p};localStorage.setItem('haboon_users',JSON.stringify(users));}
 // تحقق كلمة السر
 if(users[e].pass!==p){document.getElementById('err').style.display='block';document.getElementById('err').innerText='كلمة المرور غير صحيحة';return;}
 localStorage.setItem('haboon_current',JSON.stringify({email:e,name:users[e].name}));
 location.reload();
}

function registerEmail(){loginEmail();}

let cur=JSON.parse(localStorage.getItem('haboon_current')||'null');
if(cur){
 document.getElementById('loginBox').style.display='none';
 document.getElementById('appBox').style.display='block';
 document.getElementById('appBox').innerHTML=`
 <div style="padding:20px">
 <div style="background:#075e54;color:#fff;padding:15px;border-radius:15px;display:flex;justify-content:space-between;align-items:center">
 <b>هابون Haboon ✅</b><button onclick="logout()" style="background:#ff4444;color:#fff;border:none;padding:5px 12px;border-radius:10px">خروج</button>
 </div>
 <div style="background:#fff;padding:20px;border-radius:15px;margin-top:15px;text-align:center">
 <div style="width:70px;height:70px;background:#0ecb81;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto">${cur.name[0]}</div>
 <h2 style="margin-top:10px">${cur.name}</h2><p>${cur.email}</p><p style="color:green;margin-top:10px">تم تسجيل الدخول بنجاح بالبريد 🎉</p>
 <p style="color:#888;margin-top:15px">الآن أنت داخل هابون، يمكنك إضافة المنشورات والدردشة</p>
 </div>
 </div>`;
}
function logout(){localStorage.removeItem('haboon_current');location.reload();}
</script>
</body>
  </html>
