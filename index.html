<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هابون | Haboon Business</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma}
body{background:#f0f2f5}
.top{background:#075e54;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.top b{font-size:22px}.top b span{color:#25d366}
.container{max-width:1100px;margin:auto;padding:15px;display:flex;gap:15px}
.side{width:250px;background:#fff;border-radius:12px;padding:15px;height:fit-content;position:sticky;top:65px}
.side div{padding:12px;border-radius:8px;cursor:pointer;font-weight:bold;margin-bottom:5px}
.side div.active,.side div:hover{background:#e8f5e9;color:#075e54}
.main{flex:1}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btn{background:#25d366;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer}
.btn2{background:#075e54;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;outline:none;margin:8px 0}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.store{border:1px solid #eee;border-radius:12px;padding:10px;text-align:center;cursor:pointer;background:#fff}
.store img{width:100%;height:100px;object-fit:cover;border-radius:8px}
.badge{background:#25d366;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}
.price{color:#075e54;font-weight:bold;margin-top:5px}
.login{max-width:380px;margin:60px auto;background:#fff;padding:25px;border-radius:18px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.1)}
@media(max-width:700px){.container{flex-direction:column}.side{width:100%;position:static;display:flex;overflow-x:auto}.side div{white-space:nowrap}}
</style>
</head>
<body>

<div class="login" id="loginBox">
<div style="width:70px;height:70px;background:#075e54;border-radius:18px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:35px;color:#fff">💬</div>
<h2 style="margin:15px 0 5px;color:#075e54">هابون Haboon</h2>
<p style="color:#666;font-size:14px;margin-bottom:15px">منصة التواصل والتجارة اليمنية</p>
<input id="email" placeholder="البريد الإلكتروني example@gmail.com" dir="ltr">
<input id="name" placeholder="اسمك">
<input id="pass" type="password" placeholder="كلمة السر">
<button class="btn" style="width:100%;margin-top:10px" onclick="login()">دخول / إنشاء حساب</button>
</div>

<div id="appBox" style="display:none">
<div class="top"><b>هابون <span>Haboon</span></b><div><span id="userNameTop"></span> <button onclick="logout()" style="background:#ff4444;color:#fff;border:none;padding:5px 10px;border-radius:8px;margin-right:10px">خروج</button></div></div>

<div class="container">
<div class="side">
<div class="active" id="m1" onclick="show('feed')">🏠 الرئيسية</div>
<div id="m2" onclick="show('stores')">🛍️ سوق هابون</div>
<div id="m3" onclick="show('myStore')">🏪 متجري</div>
<div id="m4" onclick="show('business')">💼 هابون للأعمال</div>
<div id="m5" onclick="show('wallet')">💰 أرباحي</div>
</div>

<div class="main">
<!-- الرئيسية -->
<div id="feed">
<div class="card"><textarea id="postText" placeholder="بماذا تفكر؟"></textarea><button class="btn" onclick="addPost()">نشر</button></div>
<div id="posts"></div>
</div>

<!-- السوق -->
<div id="stores" style="display:none">
<div class="card"><h3>🛍️ سوق هابون - كل شيء في اليمن</h3><p style="color:#888;font-size:14px;margin-top:5px">اشتري من متاجر موثوقة - صاحب التطبيق يأخذ عمولة 2% تلقائياً</p></div>
<div class="store-grid" id="storeGrid"></div>
</div>

<!-- متجري -->
<div id="myStore" style="display:none">
<div class="card">
<h3>🏪 افتح متجرك في هابون</h3>
<input id="storeName" placeholder="اسم متجرك - مثال: جوالات عدن">
<input id="storeDesc" placeholder="ماذا تبيع؟">
<input id="productName" placeholder="اسم المنتج">
<input id="productPrice" placeholder="السعر بالريال اليمني" type="number">
<button class="btn2" onclick="addProduct()">إضافة المنتج للسوق +</button>
